<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — Pharma Control</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/PharmaControl_Isotipo.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="login-page">
  <form id="login-form" class="login-card">
    <img src="{{ url_for('static', filename='img/PharmaControl_Logo_Dark.svg') }}" alt="Pharma Control" class="login-logo">
    <p class="subtitle">Monitoreo de cumplimiento regulatorio</p>

    <label for="email">Correo</label>
    <input type="email" id="email" name="email" required autocomplete="username">

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" required autocomplete="current-password">

    <button type="submit" class="btn-primary">Entrar</button>
    <p id="login-error" class="error" hidden></p>
  </form>

  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
