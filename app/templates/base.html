<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Pharma Control{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/PharmaControl_Isotipo.svg') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
  <header class="topbar">
    <a href="{{ url_for('web.dashboard') }}" class="brand">
      <img src="{{ url_for('static', filename='img/PharmaControl_Logo_Horizontal.svg') }}" alt="Pharma Control" class="brand-logo">
    </a>
    <nav class="nav">
      <a href="{{ url_for('web.dashboard') }}">Dashboard</a>
      {% if user and user.role in ['admin', 'compliance_officer'] %}
        <a href="{{ url_for('web.productos') }}">Productos</a>
        <a href="{{ url_for('web.normativas') }}">Normativas</a>
      {% endif %}
      <a href="{{ url_for('web.alertas') }}">Alertas</a>
      <a href="{{ url_for('web.chatbot') }}">Chatbot</a>
    </nav>
    <div class="user-box">
      <span>{{ user.email if user else '' }} ({{ user.role if user else '' }})</span>
      <button id="logout-btn" class="btn-link">Salir</button>
    </div>
  </header>

  <main class="content">
    {% block content %}{% endblock %}
  </main>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
